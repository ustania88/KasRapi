<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KasRapi – Blueprint Tim Agen Pembukuan UMKM</title>
<style>
:root{--bg:#f7f6f2;--card:#fff;--text:#1d2320;--muted:#5d6762;--line:#e2e0d8;--accent:#0f7b5f;--accent-soft:#e3f3ee;--warn:#b4442b;--code:#f1efe8;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#141816;--card:#1c211f;--text:#eceee9;--muted:#a3aca7;--line:#2c3330;--accent:#4fc7a0;--accent-soft:#1d3a31;--warn:#f08a70;--code:#111513;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:960px;margin:0 auto;padding:24px 16px 64px}
header.hero{padding:40px 0 24px}
header.hero h1{font-size:clamp(2rem,6vw,3.2rem);margin:0;color:var(--accent);letter-spacing:-.02em}
header.hero p.tag{font-size:1.15rem;color:var(--muted);margin:.25rem 0 0}
.pill{display:inline-block;background:var(--accent-soft);color:var(--accent);padding:2px 10px;border-radius:99px;font-size:.8rem;margin:12px 6px 0 0}
nav{position:sticky;top:0;background:var(--bg);padding:10px 0;border-bottom:1px solid var(--line);z-index:5;display:flex;gap:14px;overflow-x:auto;white-space:nowrap}
nav a{color:var(--muted);text-decoration:none;font-size:.9rem}
nav a:hover{color:var(--accent)}
section{margin-top:40px;scroll-margin-top:56px}
h2{font-size:1.5rem;margin:0 0 14px}
h3{font-size:1.1rem;margin:0 0 6px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
.card .sub{color:var(--muted);font-size:.9rem;margin:0 0 8px}
.table-scroll{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--card)}
table{border-collapse:collapse;width:100%;min-width:480px}
th,td{padding:10px 14px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top;font-size:.92rem}
th{color:var(--muted);font-weight:600;font-size:.8rem;text-transform:uppercase;letter-spacing:.04em}
tr:last-child td{border-bottom:0}
ul{margin:6px 0;padding-left:20px}
li{margin:2px 0}
.ok li::marker{color:var(--accent)}
.no li::marker{color:var(--warn)}
.label{font-size:.75rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-top:10px}
details{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 16px;margin-top:10px}
summary{cursor:pointer;font-weight:600}
pre{background:var(--code);border-radius:10px;padding:14px;overflow-x:auto;font-size:.82rem;line-height:1.5;white-space:pre-wrap;word-break:break-word}
button.copy{margin-top:8px;border:1px solid var(--line);background:var(--card);color:var(--text);padding:6px 12px;border-radius:8px;cursor:pointer;font-size:.85rem}
button.copy:hover{border-color:var(--accent);color:var(--accent)}
.flow{counter-reset:s;list-style:none;padding:0}
.flow li{counter-increment:s;position:relative;padding:4px 0 4px 34px}
.flow li::before{content:counter(s);position:absolute;left:0;top:4px;width:24px;height:24px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-size:.8rem;display:grid;place-items:center}
.org{display:flex;flex-direction:column;align-items:center;gap:8px;margin:8px 0 4px}
.org .node{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 18px;text-align:center}
.org .node.top{border-color:var(--accent)}
.org .row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.org .arrow{color:var(--muted)}
.dl{display:inline-block;margin-top:16px;background:var(--accent);color:#fff;padding:8px 16px;border-radius:10px;text-decoration:none;font-size:.9rem}
.dl:hover{opacity:.9}
footer{margin-top:56px;color:var(--muted);font-size:.85rem;text-align:center}
#err{display:none;background:var(--card);border:1px solid var(--warn);color:var(--warn);padding:16px;border-radius:12px;margin-top:24px}
</style>
</head>
<body>
<div class="wrap">
  <header class="hero" id="hero"></header>
  <nav id="nav"></nav>
  <div id="err"></div>
  <main id="app"></main>
  <footer id="foot"></footer>
</div>

  hero.appendChild(el('p', { text: d.meta.model_bisnis }));
  var h = d.meta.harga_per_klien_per_bulan;
  hero.appendChild(el('span', { class: 'pill', text: 'Harga: Rp' + h.min.toLocaleString('id-ID') + ' – Rp' + h.max.toLocaleString('id-ID') + ' / klien / bulan' }));
  hero.appendChild(el('span', { class: 'pill', text: 'Versi ' + d.meta.versi }));
  hero.appendChild(el('br'));
  var dl = el('a', { class: 'dl', href: URL.createObjectURL(new Blob([JSON.stringify(d, null, 2)], { type: 'application/json' })), download: 'kasrapi.json', text: 'Unduh JSON' });
  hero.appendChild(dl);

  var nav = document.getElementById('nav');
  [['masalah', 'Masalah'], ['tim', 'Tim Agen'], ['alur', 'Alur Kerja'], ['memori', 'Memori'], ['implementasi', 'Implementasi'], ['prompt', 'Prompt'], ['ringkasan', 'Ringkasan']]
    .forEach(function (p) { nav.appendChild(el('a', { href: '#' + p[0], text: p[1] })); });

  var app = document.getElementById('app');

  // Masalah
  app.appendChild(section('masalah', 'Masalah yang Ditangani', [
    table(['Masalah UMKM', 'Dampak'], d.masalah.daftar.map(function (m) { return [m.masalah, m.dampak]; })),
    el('p', null, [el('strong', { text: 'Inti masalah: ' }), d.masalah.inti]),
    el('p', null, [el('strong', { text: 'Janji solusi: ' }), d.masalah.janji_solusi])
  ]));

  // Tim
  var agen = d.tim.agen;
  var org = el('div', { class: 'org' }, [
    el('div', { class: 'node top', text: d.tim.human_reviewer + ' (Human Reviewer)' }),
    el('div', { class: 'arrow', text: '↓' }),
    el('div', { class: 'node', text: agen[0].nama + ' · ' + agen[0].julukan }),
    el('div', { class: 'arrow', text: '↓' }),
    el('div', { class: 'row' }, agen.slice(1).map(function (a) { return el('div', { class: 'node', text: a.nama + ' · ' + a.julukan }); }))
  ]);
  var cards = agen.map(function (a) {
    return el('div', { class: 'card' }, [
      el('h3', { text: a.nama }),
      el('p', { class: 'sub', text: a.peran + ' · ' + a.julukan }),
      el('p', { text: a.tugas_utama }),
      el('div', { class: 'label', text: 'Mengerjakan' }), ul(a.mengerjakan, 'ok'),
      el('div', { class: 'label', text: 'Dilarang' }), ul(a.dilarang, 'no')
    ]);
  });
  app.appendChild(section('tim', 'Tim Agen (1 Leader + 2 Anggota)', [org, el('div', { class: 'grid' }, cards),
    el('h3', { text: 'Aturan Kolaborasi', style: 'margin-top:24px' }),
    table(['Aturan', 'Penjelasan'], d.aturan_kolaborasi.map(function (a) { return [a.aturan, a.penjelasan]; }))
  ]));

  // Alur
  app.appendChild(section('alur', 'Alur Kerja', [el('div', { class: 'grid' }, d.alur_kerja.map(function (f) {
    return el('div', { class: 'card' }, [el('h3', { text: f.nama }), el('p', { class: 'sub', text: f.frekuensi }),
      el('ol', { class: 'flow' }, f.langkah.map(function (s) { return el('li', { text: s }); }))]);
  }))]));

  // Memori
  var m = d.memori;
  app.appendChild(section('memori', 'Yang Perlu Disimpan di Memori', [
    el('h3', { text: 'A. Profil Klien · ' + m.profil_klien.sifat }),
    table(['Data', 'Contoh', 'Dipakai oleh'], m.profil_klien.isi.map(function (i) { return [i.data, i.contoh, i.dipakai_oleh.join(', ')]; })),
    el('h3', { text: 'B. Data Operasional · ' + m.data_operasional.sifat, style: 'margin-top:20px' }),
    table(['Data', 'Keterangan'], m.data_operasional.isi.map(function (i) { return [i.data, i.keterangan]; })),
    el('h3', { text: 'C. Pembelajaran · ' + m.pembelajaran.sifat, style: 'margin-top:20px' }),
    table(['Data', 'Manfaat'], m.pembelajaran.isi.map(function (i) { return [i.data, i.manfaat]; })),
    el('h3', { text: 'Jangan Disimpan', style: 'margin-top:20px' }), ul(m.jangan_disimpan, 'no')
  ]));

  // Implementasi
  var im = d.implementasi;
  app.appendChild(section('implementasi', 'Implementasi', [
    table(['Komponen', 'Saran'], im.teknologi.map(function (t) { return [t.komponen, t.saran]; })),
    el('h3', { text: 'Mengapa Minim Halusinasi', style: 'margin-top:20px' }), ul(im.minim_halusinasi, 'ok'),
    el('h3', { text: 'Catatan Risiko', style: 'margin-top:20px' }), ul(im.catatan_risiko, 'no')
  ]));

  // Prompt
  var pk = [promptBlock('Aturan Global (tempel di awal semua prompt)', d.aturan_global_prompt)];
  agen.forEach(function (a) { pk.push(promptBlock('Prompt ' + a.nama + ' (' + a.peran + ')', a.prompt)); });
  app.appendChild(section('prompt', 'Prompt Lengkap Tiap Agen', pk));

  // Ringkasan
  var r = d.ringkasan;
  app.appendChild(section('ringkasan', 'Ringkasan Satu Halaman', [
    table(['Elemen', 'Isi'], Object.keys(r).map(function (k) { return [k.replace(/_/g, ' '), r[k]]; }))
  ]));

  document.getElementById('foot').textContent = d.solusi.nama + ' · Blueprint v' + d.meta.versi + ' · ' + d.meta.tanggal;
}

try {
  var raw = document.getElementById('data').textContent;
  render(JSON.parse(raw));
} catch (e) {
  var box = document.getElementById('err');
  box.style.display = 'block';
  box.textContent = 'Gagal menampilkan data: ' + e.message;
}
</script>
</body>
</html>
